```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
      width: 380px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
      color: #444;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }

    .swap {
      margin: 15px 0;
      text-align: center;
    }

    .swap button {
      width: auto;
      padding: 8px 18px;
      cursor: pointer;
      background: #f1f1f1;
      border: none;
    }

    .convert-btn {
      margin-top: 20px;
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .convert-btn:hover {
      background: #5568d9;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      background: #f4f6ff;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>💱 Currency Converter</h1>

    <label for="amount">Amount</label>
    <input type="number" id="amount" placeholder="Enter amount" min="0">

    <label for="from">From Currency</label>
    <select id="from">
      <option value="USD">🇺🇸 USD - US Dollar</option>
      <option value="INR">🇮🇳 INR - Indian Rupee</option>
      <option value="EUR">🇪🇺 EUR - Euro</option>
      <option value="GBP">🇬🇧 GBP - British Pound</option>
      <option value="JPY">🇯🇵 JPY - Japanese Yen</option>
      <option value="AUD">🇦🇺 AUD - Australian Dollar</option>
      <option value="CAD">🇨🇦 CAD - Canadian Dollar</option>
    </select>

    <div class="swap">
      <button onclick="swapCurrencies()">🔄 Swap</button>
    </div>

    <label for="to">To Currency</label>
    <select id="to">
      <option value="INR">🇮🇳 INR - Indian Rupee</option>
      <option value="USD">🇺🇸 USD - US Dollar</option>
      <option value="EUR">🇪🇺 EUR - Euro</option>
      <option value="GBP">🇬🇧 GBP - British Pound</option>
      <option value="JPY">🇯🇵 JPY - Japanese Yen</option>
      <option value="AUD">🇦🇺 AUD - Australian Dollar</option>
      <option value="CAD">🇨🇦 CAD - Canadian Dollar</option>
    </select>

    <button class="convert-btn" onclick="convertCurrency()">
      Convert Currency
    </button>

    <div id="result">Result will appear here</div>
    <div id="error" class="error"></div>
  </div>

  <script>
    // Sample exchange rates.
    // For production use, connect this application to a live currency API.
    const rates = {
      USD: {
        USD: 1,
        INR: 95.6,
        EUR: 0.85,
        GBP: 0.74,
        JPY: 147.0,
        AUD: 1.53,
        CAD: 1.38
      },

      INR: {
        USD: 1 / 95.6,
        INR: 1,
        EUR: 0.0089,
        GBP: 0.0077,
        JPY: 1.54,
        AUD: 0.016,
        CAD: 0.014
      },

      EUR: {
        USD: 1.18,
        INR: 112.5,
        EUR: 1,
        GBP: 0.87,
        JPY: 173,
        AUD: 1.80,
        CAD: 1.62
      },

      GBP: {
        USD: 1.35,
        INR: 128.5,
        EUR: 1.15,
        GBP: 1,
        JPY: 198,
        AUD: 2.06,
        CAD: 1.86
      },

      JPY: {
        USD: 0.0068,
        INR: 0.65,
        EUR: 0.0058,
        GBP: 0.0051,
        JPY: 1,
        AUD: 0.0104,
        CAD: 0.0094
      },

      AUD: {
        USD: 0.65,
        INR: 62.5,
        EUR: 0.56,
        GBP: 0.49,
        JPY: 96,
        AUD: 1,
        CAD: 0.90
      },

      CAD: {
        USD: 0.72,
        INR: 69.2,
        EUR: 0.62,
        GBP: 0.54,
        JPY: 106,
        AUD: 1.11,
        CAD: 1
      }
    };

    function convertCurrency() {
      const amount = parseFloat(document.getElementById("amount").value);
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;

      const result = document.getElementById("result");
      const error = document.getElementById("error");

      error.textContent = "";

      if (isNaN(amount) || amount <= 0) {
        result.textContent = "Result will appear here";
        error.textContent = "Please enter a valid amount.";
        return;
      }

      const rate = rates[from][to];
      const convertedAmount = amount * rate;

      result.textContent =
        `${amount} ${from} = ${convertedAmount.toFixed(2)} ${to}`;
    }

    function swapCurrencies() {
      const from = document.getElementById("from");
      const to = document.getElementById("to");

      const temp = from.value;
      from.value = to.value;
      to.value = temp;

      convertCurrency();
    }
  </script>

</body>
</html>
